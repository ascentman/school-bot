[project]
name = "school-bot"
version = "0.1.0"
description = "Telegram-бот обліку харчування учнів школи"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "apscheduler>=3.11,<4",
    "pydantic-settings>=2.7",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "gspread>=6.1",
    "google-auth>=2.37",
    "typer>=0.15",
]

[project.scripts]
school-bot = "school_bot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/school_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: піднімає підпроцеси, повільніше за решту"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer вимагає виклики у значеннях за замовчуванням
"src/school_bot/cli.py" = ["B008"]
